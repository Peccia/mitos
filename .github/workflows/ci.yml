name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv build/.venv
          build/.venv/bin/python -m pip install -r build/requirements.txt

      - name: Validate registry schema + self-drift guard
        # compile regenerates the repo's own AGENTS.md (no machine's local_path points at
        # a contributor's checkout, so deploy can't). A stale commit therefore fails
        # because compile CHANGED the file — not because someone remembered to check.
        run: |
          build/.venv/bin/python build/compile.py compile
          git diff --exit-code -- AGENTS.md

      - name: Run test suite
        run: build/.venv/bin/python build/tests/test_compiler.py
