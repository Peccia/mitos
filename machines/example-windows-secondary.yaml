# Example: Use case 2 — all coding harnesses (Claude Code + Antigravity + Claude
# Desktop), no agentic tree, no orgs. A secondary Windows device (minimal config).
# Compare with example-workstation.yaml (use case 1 — Claude Code only) and
# example-linux.yaml (use case 3 — the full agentic assistant). Adding `agents-md` or
# `mitos-agent` to `targets` below is what turns on the agentic tree and orgs — see
# registry/README.md's "Choosing your setup".
# Copy to registry/local/machines/ and customize for your setup.
name: example-windows-secondary
example: true   # template — copy into registry/local/machines/ and rename; not a live machine
os: windows
targets: [antigravity, claude-app, claude-code]
paths:
  projects_root: "C:/Projects"
  antigravity_config: "~/.gemini/config"
  antigravity_skills: "~/.gemini/config/skills"   # Antigravity's global skills dir
  claude_code_skills: "~/.claude/skills"
  claude_skills_staging: "~/ClaudeSkills"